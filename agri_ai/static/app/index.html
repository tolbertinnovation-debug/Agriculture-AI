<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6b3a">
<title>Farm Assistant</title>
<link rel="manifest" href="/static/app/manifest.webmanifest">
<link rel="icon" href="/static/app/icon.svg" type="image/svg+xml">
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#1e2a1f;--muted:#5d6b5f;--line:#e2e0d6;--brand:#2f6b3a;--brand-ink:#fff;--warn:#b26b00;--crit:#b3261e;--info:#245b8f;--ok:#2f6b3a}
@media (prefers-color-scheme:dark){:root{--bg:#121512;--card:#1c211c;--ink:#e8ede6;--muted:#a3b0a3;--line:#2c342c;--brand:#6fb57b;--brand-ink:#0d150e;--warn:#f0b04f;--crit:#ff8a80;--info:#8ab8e6;--ok:#6fb57b}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:76px}
header{background:var(--brand);color:var(--brand-ink);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:2}
header h1{font-size:18px;margin:0}
header select{width:auto;background:transparent;color:inherit;border:1px solid currentColor;border-radius:8px;padding:4px 6px;font-size:14px}
header select option{color:#000}
main{max-width:640px;margin:0 auto;padding:12px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{min-height:90px;resize:vertical}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:13px 16px;background:var(--brand);color:var(--brand-ink);width:100%;margin-top:12px;cursor:pointer;min-height:48px}
button.secondary{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
button.small{width:auto;padding:8px 14px;min-height:38px;margin:6px 6px 0 0}
button:disabled{opacity:.55}
.row{display:flex;gap:8px}.row>*{flex:1}
.wx{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.wx div{min-width:68px;text-align:center;background:var(--bg);border-radius:10px;padding:8px 4px;font-size:13px}
.wx b{display:block;font-size:15px}
.rain{color:var(--info);font-weight:600}
.alert{border-left:4px solid var(--info);padding:8px 10px;margin:8px 0;background:var(--bg);border-radius:0 8px 8px 0}
.alert.warning{border-color:var(--warn)}.alert.critical{border-color:var(--crit)}
.muted{color:var(--muted);font-size:14px}
.answer{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:12px;margin-top:12px}
.price{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.price:last-child{border:0}
.up{color:var(--ok)}.down{color:var(--crit)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--muted);border-radius:0;margin:0;padding:8px 2px;font-size:12px;font-weight:500;min-height:60px}
nav button.active{color:var(--brand);font-weight:700}
nav svg{display:block;margin:0 auto 2px;width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{background:var(--crit);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-left:2px}
#preview{max-width:100%;border-radius:10px;margin-top:10px;display:none}
.hidden{display:none!important}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--bg);font-size:12px;border:1px solid var(--line)}
.toast{position:fixed;left:16px;right:16px;bottom:90px;background:var(--ink);color:var(--bg);padding:12px;border-radius:10px;text-align:center;z-index:5}
</style>
</head>
<body>
<header>
  <h1 id="brand">Farm Assistant</h1>
  <select id="lang" aria-label="Language"><option value="en">English</option><option value="sw">Kiswahili</option><option value="fr">Français</option></select>
</header>

<main>
  <!-- Login -->
  <section id="v-login" class="hidden">
    <div class="card">
      <h2 data-t="login"></h2>
      <p class="muted" data-t="login_help"></p>
      <label for="phone" data-t="phone"></label>
      <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="07xx xxx xxx">
      <button id="btn-code" data-t="send_code"></button>
      <div id="code-box" class="hidden">
        <label for="code" data-t="code"></label>
        <input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
        <button id="btn-verify" data-t="login_btn"></button>
      </div>
    </div>
  </section>

  <!-- Home -->
  <section id="v-home" class="hidden">
    <div class="card"><h2 data-t="weather"></h2><div id="wx" class="wx"></div><div id="wx-warn"></div><div id="no-loc" class="muted hidden" data-t="no_location"></div>
      <button id="btn-loc" class="secondary small hidden" data-t="use_location"></button></div>
    <div class="card"><h2 data-t="todo"></h2><div id="tips"></div></div>
    <div class="card"><h2 data-t="prices"></h2><div id="prices"></div></div>
  </section>

  <!-- Diagnose -->
  <section id="v-diagnose" class="hidden">
    <div class="card">
      <h2 data-t="diagnose"></h2>
      <p class="muted" data-t="photo_help"></p>
      <label for="d-crop" data-t="crop"></label><select id="d-crop"></select>
      <input id="photo" type="file" accept="image/*" capture="environment" class="hidden">
      <button id="btn-photo" data-t="take_photo"></button>
      <img id="preview" alt="">
      <label for="d-note" data-t="note"></label><input id="d-note">
      <button id="btn-diagnose" class="hidden" data-t="check"></button>
      <div id="d-result" class="answer hidden"></div>
    </div>
    <div class="card"><h2 data-t="history"></h2><div id="d-history" class="muted"></div></div>
  </section>

  <!-- Ask -->
  <section id="v-ask" class="hidden">
    <div class="card">
      <h2 data-t="ask"></h2>
      <textarea id="question"></textarea>
      <button id="btn-ask" data-t="send"></button>
      <div id="answer" class="answer hidden"></div>
      <div id="feedback" class="hidden"><span class="muted" data-t="helpful"></span>
        <button class="small secondary" data-fb="1" data-t="yes"></button><button class="small secondary" data-fb="0" data-t="no"></button></div>
    </div>
  </section>

  <!-- Market -->
  <section id="v-market" class="hidden">
    <div class="card"><h2 data-t="offers"></h2><div id="offers" class="muted"></div></div>
    <div class="card">
      <h2 data-t="sell"></h2>
      <div id="consent-box" class="hidden"><p class="muted" data-t="consent_text"></p><button id="btn-consent" class="secondary" data-t="consent_btn"></button></div>
      <div id="sell-form">
        <label for="s-crop" data-t="crop"></label><select id="s-crop"></select>
        <div class="row"><div><label for="s-kg" data-t="kg"></label><input id="s-kg" type="number" min="1" inputmode="decimal"></div>
        <div><label for="s-price" data-t="min_price"></label><input id="s-price" type="number" min="0" inputmode="decimal"></div></div>
        <label for="s-grade" data-t="grade"></label><select id="s-grade"><option>A</option><option selected>B</option><option>C</option></select>
        <button id="btn-sell" data-t="list_btn"></button>
      </div>
    </div>
    <div class="card"><h2 data-t="my_listings"></h2><div id="listings" class="muted"></div></div>
  </section>

  <!-- Alerts -->
  <section id="v-alerts" class="hidden">
    <div class="card"><h2 data-t="alerts"></h2><div id="alerts" class="muted"></div></div>
    <button class="secondary" id="btn-logout" data-t="logout"></button>
  </section>
</main>

<nav id="nav" class="hidden">
  <button data-v="home" class="active"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-t="nav_home"></span></button>
  <button data-v="diagnose"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span data-t="nav_diagnose"></span></button>
  <button data-v="ask"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg><span data-t="nav_ask"></span></button>
  <button data-v="market"><svg viewBox="0 0 24 24"><path d="M3 9l2-5h14l2 5M3 9h18v11H3zM9 20v-6h6v6"/></svg><span data-t="nav_market"></span></button>
  <button data-v="alerts"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4zM10 21h4"/></svg><span data-t="nav_alerts"></span><span id="badge" class="badge hidden"></span></button>
</nav>

<script>
const T = {
  en:{login:"Log in",login_help:"Enter the phone number registered with your co-operative or service. We will send you a code by SMS.",phone:"Phone number",send_code:"Send code",code:"6-digit code",login_btn:"Log in",
    weather:"Weather",no_location:"Set your farm location to get forecasts.",use_location:"Use my current location",todo:"What to do now",prices:"Market prices",
    diagnose:"Check a sick plant",photo_help:"Take a close photo of the affected leaf or fruit in daylight.",crop:"Crop",take_photo:"Take photo",note:"What do you see? (optional)",check:"Check plant",history:"Previous checks",
    ask:"Ask an expert",send:"Send",helpful:"Was this helpful?",yes:"Yes",no:"No",offers:"Offers from buyers",sell:"Sell produce",kg:"Quantity (kg)",min_price:"Lowest price per kg",grade:"Quality grade",list_btn:"List for sale",my_listings:"My listings",
    consent_text:"To receive offers, we share your produce, village and quantity with verified buyers. Your phone number is shared only after you accept an offer.",consent_btn:"I agree",
    alerts:"Alerts",logout:"Log out",nav_home:"Home",nav_diagnose:"Diagnose",nav_ask:"Ask",nav_market:"Market",nav_alerts:"Alerts",accept:"Accept",decline:"Decline",none:"Nothing yet.",wait:"Please wait…",offline:"No connection. Try again when you have network.",
    review:"Sent to an extension officer",no_prices:"No recent prices.",withdraw:"Withdraw"},
  sw:{login:"Ingia",login_help:"Weka namba ya simu uliyosajiliwa nayo. Tutakutumia nambari ya siri kwa SMS.",phone:"Namba ya simu",send_code:"Tuma nambari",code:"Nambari ya tarakimu 6",login_btn:"Ingia",
    weather:"Hali ya hewa",no_location:"Weka eneo la shamba lako kupata utabiri.",use_location:"Tumia eneo langu la sasa",todo:"Kazi za sasa",prices:"Bei za soko",
    diagnose:"Kagua mmea mgonjwa",photo_help:"Piga picha ya karibu ya jani au tunda lililoathirika mchana.",crop:"Zao",take_photo:"Piga picha",note:"Unaona nini? (si lazima)",check:"Kagua mmea",history:"Ukaguzi uliopita",
    ask:"Uliza mtaalamu",send:"Tuma",helpful:"Je, imesaidia?",yes:"Ndiyo",no:"Hapana",offers:"Ofa kutoka kwa wanunuzi",sell:"Uza mazao",kg:"Kiasi (kg)",min_price:"Bei ya chini kwa kilo",grade:"Daraja",list_btn:"Orodhesha",my_listings:"Mazao yangu",
    consent_text:"Ili kupata ofa, tunashiriki zao, kijiji na kiasi chako na wanunuzi waliothibitishwa. Namba yako hutolewa tu ukikubali ofa.",consent_btn:"Nakubali",
    alerts:"Taarifa",logout:"Toka",nav_home:"Nyumbani",nav_diagnose:"Kagua",nav_ask:"Uliza",nav_market:"Soko",nav_alerts:"Taarifa",accept:"Kubali",decline:"Kataa",none:"Hakuna bado.",wait:"Tafadhali subiri…",offline:"Hakuna mtandao. Jaribu tena.",
    review:"Imetumwa kwa afisa ugani",no_prices:"Hakuna bei za karibuni.",withdraw:"Ondoa"},
  fr:{login:"Connexion",login_help:"Entrez le numéro enregistré auprès de votre coopérative. Nous vous enverrons un code par SMS.",phone:"Numéro de téléphone",send_code:"Envoyer le code",code:"Code à 6 chiffres",login_btn:"Se connecter",
    weather:"Météo",no_location:"Indiquez la position de votre ferme pour les prévisions.",use_location:"Utiliser ma position",todo:"À faire maintenant",prices:"Prix du marché",
    diagnose:"Examiner une plante malade",photo_help:"Photographiez de près la feuille ou le fruit atteint, à la lumière du jour.",crop:"Culture",take_photo:"Prendre une photo",note:"Que voyez-vous ? (facultatif)",check:"Examiner",history:"Examens précédents",
    ask:"Poser une question",send:"Envoyer",helpful:"Était-ce utile ?",yes:"Oui",no:"Non",offers:"Offres d'acheteurs",sell:"Vendre",kg:"Quantité (kg)",min_price:"Prix minimum par kg",grade:"Qualité",list_btn:"Mettre en vente",my_listings:"Mes annonces",
    consent_text:"Pour recevoir des offres, nous partageons votre produit, village et quantité avec des acheteurs vérifiés. Votre numéro n'est partagé qu'après acceptation.",consent_btn:"J'accepte",
    alerts:"Alertes",logout:"Déconnexion",nav_home:"Accueil",nav_diagnose:"Examiner",nav_ask:"Question",nav_market:"Marché",nav_alerts:"Alertes",accept:"Accepter",decline:"Refuser",none:"Rien pour l'instant.",wait:"Veuillez patienter…",offline:"Pas de connexion. Réessayez.",
    review:"Transmis à un conseiller",no_prices:"Aucun prix récent.",withdraw:"Retirer"}
};
const $ = s => document.querySelector(s);
const store = {get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
let lang = store.get("agri_lang") || (navigator.language||"en").slice(0,2);
if(!T[lang]) lang="en";
let token = store.get("agri_token");
let state = {home:null, adviceId:null, photo:null};
const t = k => (T[lang]||T.en)[k] || T.en[k] || k;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function applyLang(){
  document.documentElement.lang = lang; $("#lang").value = lang;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
}
function toast(msg){const d=document.createElement("div");d.className="toast";d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}

async function api(path, opts={}){
  const headers = Object.assign({}, opts.headers||{});
  if(token) headers.Authorization = "Bearer " + token;
  if(opts.json){headers["Content-Type"]="application/json"; opts.body=JSON.stringify(opts.json)}
  let r;
  try { r = await fetch("/api/v1/farmer"+path, {method:opts.method||"GET", headers, body:opts.body}); }
  catch(e){ toast(t("offline")); throw e; }
  if(r.status===401 && !path.startsWith("/auth")){ logout(); throw new Error("auth"); }
  const data = r.status===204 ? null : await r.json().catch(()=>null);
  if(!r.ok){ toast((data && (data.detail?.[0]?.msg || data.detail)) || ("Error "+r.status)); throw new Error(r.status); }
  return data;
}

function show(view){
  document.querySelectorAll("main>section").forEach(s => s.classList.toggle("hidden", s.id !== "v-"+view));
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.v===view));
  ({home:loadHome, diagnose:loadDiagnoses, market:loadMarket, alerts:loadAlerts})[view]?.();
  window.scrollTo(0,0);
}

function logout(){ token=null; store.set("agri_token",null); $("#nav").classList.add("hidden"); show("login"); }

// ---------------- login
$("#btn-code").onclick = async () => {
  const r = await api("/auth/request-code",{method:"POST",json:{phone:$("#phone").value}});
  $("#code-box").classList.remove("hidden");
  if(r.dev_code){ $("#code").value = r.dev_code; } // development mode only
  $("#code").focus();
};
$("#btn-verify").onclick = async () => {
  const r = await api("/auth/verify",{method:"POST",json:{phone:$("#phone").value, code:$("#code").value}});
  token = r.token; store.set("agri_token", token);
  if(r.farmer.language && T[r.farmer.language]){ lang=r.farmer.language; store.set("agri_lang",lang); applyLang(); }
  start();
};

// ---------------- home
async function loadHome(){
  const h = state.home = await api("/home");
  $("#brand").textContent = h.brand;
  const opts = h.crops.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("");
  const mine = h.farmer.plots.map(p=>p.crop);
  ["#d-crop","#s-crop"].forEach(sel => { $(sel).innerHTML = opts; if(mine[0]) $(sel).value = mine[0]; });
  const hasLoc = h.forecast !== null;
  $("#no-loc").classList.toggle("hidden", hasLoc); $("#btn-loc").classList.toggle("hidden", hasLoc && h.farmer.lat!==null);
  $("#wx").innerHTML = (h.forecast||[]).map((d,i) => {
    const day = new Date(d.date+"T12:00").toLocaleDateString(lang,{weekday:"short"});
    return `<div><b>${esc(day)}</b>${Math.round(d.tmin)}–${Math.round(d.tmax)}°<br><span class="rain">${Math.round(d.rain_mm)} mm</span></div>`;
  }).join("");
  $("#wx-warn").innerHTML = h.weather_warnings.map(w => `<div class="alert ${w.severity}">${esc(w.message)}</div>`).join("");
  $("#tips").innerHTML = h.tips.length ? h.tips.map(x => `<p>${esc(x)}</p>`).join("") : `<p class="muted">${t("none")}</p>`;
  const rows = Object.entries(h.prices).flatMap(([crop, qs]) => qs.map(q => {
    const cls = q.trend==="up"?"up":q.trend==="down"?"down":"";
    const ch = q.change_pct!==null ? ` <span class="${cls}">${q.change_pct>0?"▲":q.change_pct<0?"▼":""}${Math.abs(q.change_pct)}%</span>` : "";
    const cname = h.crops.find(c=>c.id===crop)?.name||crop;
    return `<div class="price"><span>${esc(cname.charAt(0).toUpperCase()+cname.slice(1))} · ${esc(q.market)}</span><b>${q.price_per_kg} ${esc(q.currency)}/kg${ch}</b></div>`;
  }));
  $("#prices").innerHTML = rows.join("") || `<p class="muted">${t("no_prices")}</p>`;
  setBadge(h.unread_alerts);
}
function setBadge(n){ $("#badge").textContent=n; $("#badge").classList.toggle("hidden", !n); }
$("#btn-loc").onclick = () => navigator.geolocation?.getCurrentPosition(async p => {
  await api("/me",{method:"PATCH",json:{lat:+p.coords.latitude.toFixed(4), lon:+p.coords.longitude.toFixed(4)}});
  loadHome();
}, () => toast("Location unavailable"));

// ---------------- diagnose: compress on the phone before upload (data is expensive)
$("#btn-photo").onclick = () => $("#photo").click();
$("#photo").onchange = async e => {
  const file = e.target.files[0]; if(!file) return;
  state.photo = await shrink(file, 1280, 0.82);
  $("#preview").src = URL.createObjectURL(state.photo); $("#preview").style.display="block";
  $("#btn-diagnose").classList.remove("hidden"); $("#d-result").classList.add("hidden");
};
function shrink(file, max, quality){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      c.toBlob(b => res(b || file), "image/jpeg", quality);
    };
    img.onerror = () => res(file);
    img.src = URL.createObjectURL(file);
  });
}
$("#btn-diagnose").onclick = async () => {
  const b = $("#btn-diagnose"); b.disabled = true; b.textContent = t("wait");
  try{
    const fd = new FormData(); fd.append("image", state.photo, "leaf.jpg"); fd.append("crop", $("#d-crop").value);
    if($("#d-note").value) fd.append("note", $("#d-note").value);
    const r = await api("/diagnose",{method:"POST", body:fd});
    const box = $("#d-result"); box.classList.remove("hidden");
    const d = r.diagnosis;
    box.innerHTML = esc(r.message) + (d ? `<br><br><span class="chip">${esc(d.status==="needs_review"?t("review"):d.label||"")}</span>` +
      ((d.result.actions||[]).length ? "<ul>"+d.result.actions.map(a=>`<li>${esc(a)}</li>`).join("")+"</ul>" : "") : "");
    if(r.retake){ $("#btn-diagnose").classList.add("hidden"); }
    loadDiagnoses();
  } finally { b.disabled=false; b.textContent=t("check"); }
};
async function loadDiagnoses(){
  if(!state.home) await loadHome();
  const rows = await api("/diagnoses");
  $("#d-history").innerHTML = rows.length ? rows.map(d => `<div class="price"><span>${esc(new Date(d.created_at).toLocaleDateString(lang))} · ${esc(d.label||d.pest_id||"?")}</span><span class="chip">${esc(d.status==="needs_review"?t("review"):Math.round(d.confidence*100)+"%")}</span></div>`).join("") : t("none");
}

// ---------------- ask
$("#btn-ask").onclick = async () => {
  const q = $("#question").value.trim(); if(q.length<2) return;
  const b = $("#btn-ask"); b.disabled=true; b.textContent=t("wait");
  try{
    const r = await api("/advice",{method:"POST",json:{question:q}});
    state.adviceId = r.id;
    $("#answer").textContent = r.answer; $("#answer").classList.remove("hidden"); $("#feedback").classList.remove("hidden");
  } finally { b.disabled=false; b.textContent=t("send"); }
};
document.querySelectorAll("[data-fb]").forEach(btn => btn.onclick = async () => {
  await api(`/advice/${state.adviceId}/feedback`,{method:"POST",json:{helpful:btn.dataset.fb==="1"}});
  $("#feedback").classList.add("hidden"); toast("✓");
});

// ---------------- market
async function loadMarket(){
  if(!state.home) await loadHome();
  const consent = state.home.farmer.consent_marketplace;
  $("#consent-box").classList.toggle("hidden", consent); $("#sell-form").classList.toggle("hidden", !consent);
  const [offers, listings] = await Promise.all([api("/offers"), api("/listings")]);
  $("#offers").innerHTML = offers.length ? offers.map(o => `<div class="alert ${o.status==="proposed"?"warning":""}">
      <b>${esc(o.buyer_name)}</b>: ${o.quantity_kg} kg · ${o.price_per_kg} ${esc(o.currency)}/kg · ${Math.round(o.distance_km||0)} km <span class="chip">${esc(o.status)}</span>
      ${o.status==="proposed" ? `<div><button class="small" data-offer="${esc(o.code)}" data-d="accept">${t("accept")}</button><button class="small secondary" data-offer="${esc(o.code)}" data-d="decline">${t("decline")}</button></div>` : ""}
    </div>`).join("") : t("none");
  $("#offers").querySelectorAll("[data-offer]").forEach(b => b.onclick = async () => {
    const r = await api(`/offers/${b.dataset.offer}/${b.dataset.d}`,{method:"POST"}); toast(r.message); loadMarket();
  });
  $("#listings").innerHTML = listings.length ? listings.map(l => `<div class="price"><span>${esc(l.crop)} · ${l.remaining_kg}/${l.quantity_kg} kg · ${esc(l.grade)}</span>
      <span style="display:flex;gap:6px;align-items:center"><span class="chip">${esc(l.status)}</span>${l.status==="open"?` <button class="small secondary" data-w="${l.id}">${t("withdraw")}</button>`:""}</span></div>`).join("") : t("none");
  $("#listings").querySelectorAll("[data-w]").forEach(b => b.onclick = async () => { await api(`/listings/${b.dataset.w}/withdraw`,{method:"POST"}); loadMarket(); });
}
$("#btn-consent").onclick = async () => { await api("/me",{method:"PATCH",json:{consent_marketplace:true}}); state.home=null; loadMarket(); };
$("#btn-sell").onclick = async () => {
  const body = {crop:$("#s-crop").value, quantity_kg:+$("#s-kg").value, grade:$("#s-grade").value};
  if(+$("#s-price").value > 0) body.min_price_per_kg = +$("#s-price").value;
  if(!(body.quantity_kg>0)) return;
  await api("/listings",{method:"POST",json:body}); $("#s-kg").value=""; $("#s-price").value=""; loadMarket();
};

// ---------------- alerts
async function loadAlerts(){
  const rows = await api("/alerts");
  $("#alerts").innerHTML = rows.length ? rows.map(a => `<div class="alert ${a.severity}"><b>${esc(a.title)}</b><br>${esc(a.body)}<br><span class="muted">${esc(new Date(a.created_at).toLocaleString(lang))}</span></div>`).join("") : t("none");
  if(rows.some(a=>!a.read)){ await api("/alerts/read",{method:"POST"}); setBadge(0); }
}
$("#btn-logout").onclick = logout;

// ---------------- boot
$("#lang").onchange = async e => {
  lang = e.target.value; store.set("agri_lang", lang); applyLang();
  if(token){ await api("/me",{method:"PATCH",json:{language:lang}}); state.home=null; show("home"); }
};
document.querySelectorAll("nav button").forEach(b => b.onclick = () => show(b.dataset.v));
function start(){ $("#nav").classList.remove("hidden"); show("home"); }
applyLang();
if(token) start(); else show("login");
if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script>
</body>
