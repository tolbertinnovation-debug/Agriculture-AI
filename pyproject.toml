[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agri-ai"
version = "0.1.0"
description = "Agriculture AI: crop advice, pest detection, weather & price alerts and farmer-buyer matching for smallholder farmers, distributed through telcos, co-ops and NGOs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pillow>=10",
  "anthropic>=1.15",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["agri_ai*"]

[tool.setuptools.package-data]
agri_ai = ["knowledge/*.json", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
